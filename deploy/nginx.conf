# Nginx Reverse Proxy Configuration for Nourish
# Place in /etc/nginx/sites-available/nourish and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name nourish.iroquoismath.com; # Replace with your EC2 domain or public IP

    # Proxy to Gunicorn running on port 8002
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Static assets caching
    location /static/ {
        alias /home/ubuntu/Nourish/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    client_max_body_size 10M;
}
